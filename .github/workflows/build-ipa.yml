name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets to native project
        run: npx cap sync ios

      - name: Build unsigned IPA
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resolvePackageDependencies \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/App.xcarchive

      - name: Create unsigned IPA
        working-directory: ios/App
        run: |
          set -e
          APP_PATH="$(find build -path '*/Products/*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find build -name '*.app' -type d | head -n 1)"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found under ios/App/build"
            find build -maxdepth 4 | head -n 60
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r App-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned.ipa
          path: ios/App/build/App-unsigned.ipa
